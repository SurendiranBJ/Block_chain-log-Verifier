{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card mt-4 border-info">
            <div class="card-header bg-info text-dark fw-bold">
                <h5 class="mb-0">Add New Log Source</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Case ID</label>
                        <input type="text" name="case_id" class="form-control bg-dark text-white border-secondary" placeholder="e.g. CASE-2024-001" required>
                        <div class="form-text text-muted">A unique identifier used on the blockchain to store these logs.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Absolute Log File Path</label>
                        <input type="text" name="log_path" class="form-control bg-dark text-white border-secondary" placeholder="/home/user/logs/app.log" required>
                        <div class="form-text text-muted">The complete path to the log file to monitor.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Description (Optional)</label>
                        <textarea name="description" class="form-control bg-dark text-white border-secondary" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-info fw-bold w-100">Start Monitoring</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
