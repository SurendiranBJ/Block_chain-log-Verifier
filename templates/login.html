{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🛡️</div>
            <h2 style="font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 3px; background: linear-gradient(135deg, #00e5ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">LOGCHAIN</h2>
            <p style="color: var(--text-dim); font-size: 0.85rem; letter-spacing: 1px;">BLOCKCHAIN LOG INTEGRITY VERIFIER</p>
        </div>

        <div class="card" style="border: 1px solid var(--border-color); overflow: hidden; position: relative;">
            <!-- Gradient top bar -->
            <div style="height: 3px; background: linear-gradient(90deg, #00e5ff, #7c3aed, #00e5ff); background-size: 200% 100%; animation: shimmer 3s ease-in-out infinite;"></div>

            <div class="card-body p-4">
                <h5 class="text-center mb-4" style="color: var(--text-secondary); font-weight: 600;">Secure Login</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn w-100 mb-3 fw-bold py-2" style="background: linear-gradient(135deg, #00e5ff 0%, #7c3aed 100%); color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; letter-spacing: 1px; transition: all 0.3s ease;">
                        🔐 Login to LogChain
                    </button>
                    <div class="text-center">
                        <small style="color: var(--text-dim);">Need an account? <a href="{{ url_for('register') }}" style="color: var(--accent-cyan); text-decoration: none;">Register here</a></small><br>
                        <small style="color: var(--text-dim); opacity: 0.5;">Default admin: admin / admin123</small>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <small style="color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 2px;">SECURED BY ETHEREUM BLOCKCHAIN</small>
        </div>
    </div>
</div>

<style>
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    .card:hover {
        border-color: rgba(0, 229, 255, 0.3);
        box-shadow: 0 8px 40px rgba(0, 229, 255, 0.08), 0 0 0 1px rgba(0, 229, 255, 0.1);
    }

    .btn:hover {
        filter: brightness(1.2);
        box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
        transform: translateY(-1px);
    }
</style>
{% endblock %}
